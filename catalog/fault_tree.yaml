# Fault tree for the thermal top event, as reviewable data rather than code.
#
# WHAT THIS ADDS THAT THE TRACEABILITY CHAIN DOES NOT. The chain proves every
# injected fault descends from a hazard. It does not prove the reverse: that
# every WAY the hazard can happen has been attacked. A fault tree decomposes the
# top event into the combinations that produce it, and the minimal cut sets are
# then a checklist the campaign can be measured against. One artefact answers
# "is this fault justified", the other answers "is anything missing".
#
# THE GATE THIS FILE FEEDS. An order-1 cut set is a single point of failure: one
# basic event, alone, reaches the top event. Every one of those must be
# challenged by an injected fault, or declared unattackable with a reason, or
# the build fails. Order-2 cut sets need two faults and are the dual-point
# campaign's territory, so each one is either mapped to a catalogued pair in
# `catalog/dual_point.yaml` or counted as unattacked. Nothing is allowed to be
# silently absent.
#
# BASIC EVENTS CARRY THEIR FAULT IDS, which is what "mapping the campaign onto
# the cut sets" means in practice. `challenged_by: []` is legal and is a
# declaration, not an oversight: it must come with `unattacked_reason`.
#
# GATE SEMANTICS. `OR` means any child is sufficient. `AND` means all children
# are required. There is no voting gate, and since DUT v3.1 there is no vote in
# the device either: ANY thermal channel that fires stops the drive. So the
# protection fails only when EVERY channel that could have fired in time has
# failed, which is an AND over the channels. An earlier version of this file
# modelled a 2-of-3 majority over two sensors and a predicted-temperature
# estimator. The estimator was withdrawn in v3.0 and the device never voted, so
# that tree described a design that did not exist.
#
# A channel gate used under several demands is written once and reused with a
# YAML anchor (`&winding`, `*winding`). The loader sees identical nodes, and the
# ids are what tell the cut set algebra they are the same events.
#
# THE CHANNELS, as `_thermal_trip_reason` in the pinned DUT evaluates them:
#
#   SENSOR_DISAGREEMENT  winding and frame sensors contradict each other while
#                        current flows. Needs both sensors.
#   OVERTEMP_WINDING     the winding sensor reaches the trip.
#   OVERLOAD_I2T         an accumulator over the CURRENT SENSOR crosses its
#                        budget. Fails whenever that sensor under-reads.
#   OVERTEMP_HOUSING     the frame sensor reaches its limit, and ONLY while the
#                        two channels agree. Suppressed under disagreement, so it
#                        is not independent of the cross check: both hang on the
#                        frame sensor and are drawn below as one frame path.

version: 1

# THE DEMAND IS A CONDITION, NOT A FAULT, and the first version of this file got
# that wrong. It made the top event AND(heat is generated, protection fails),
# which is true as a sentence and useless as a tree: every cut set then contains
# a demand event, every order goes up by one, and there are NO order-1 cut sets
# at all. The single-point-of-failure gate passed while guarding nothing, which
# is the exact shape of check this repository argues against.
#
# So the demand never appears as a basic event. What the rebuild for v3.1 had to
# add is that the demand still decides WHICH CHANNELS COUNT. The frame node is a
# large thermal mass and the overload channel integrates current, so:
#
#   locked rotor       too fast for the frame. The cross check fires late and the
#                      frame limit later still, so only the winding sensor and
#                      the overload channel can act in time.
#   sustained overload every channel acts in time.
#   degraded cooling   heat arrives at rated current, so the overload
#                      accumulator never grows. Only the temperature channels
#                      can act.
#
# Each demand is therefore a GATE over the channels it credits, never a basic
# event, and the cut sets underneath stay failures of protection alone. That
# keeps the lesson above and avoids the opposite error, which is crediting a
# channel under a demand it cannot see.

demand:
  title: Excess heat is generated in the winding
  note: >
    The condition under which protection is required. NOT part of the cut sets.
    Each route is real, is exercised by the campaign, and selects which channels
    the tree may credit below.
  causes:
    - id: BE-STALL
      title: Rotor blocked while torque is commanded
      challenged_by: [FLT-A01, FLT-A04]
    - id: BE-OVERLOAD
      title: Sustained current above the rated duty, rotor still turning
      challenged_by: [FLT-S08]
      note: >
        FLT-S08 is the only catalogued fault run under the overloaded_rotor
        precondition. The fault it injects is a sensor lie; the precondition is
        the demand.
    - id: BE-COOLING
      title: Cooling degraded, winding hot at rated current
      challenged_by: [FLT-A03]

top_event:
  id: TOP
  title: Winding exceeds its insulation limit
  hazard: HAZ-03
  goal: SG-03
  note: >
    Read as: GIVEN a thermal demand, these are the ways the winding passes
    155 C. Communication and liveness faults are not in this tree. They lead to
    HAZ-02 and HAZ-04, not to this one, because every thermal channel is local
    to the drive and trips whatever the link is doing. The previous tree carried
    them here, which is how clock drift came to be reported as a single point of
    failure for overtemperature.
  gate: OR
  children:

    # --- detection: no channel fires in time ------------------------------
    - id: G-DETECT
      title: No thermal channel trips in time
      gate: OR
      children:

        - id: G-D-STALL
          title: "Locked rotor: winding and I2t fail"
          note: >
            The frame paths are not credited here. Under locked rotor current the
            winding covers its whole permitted rise before the frame diverges.
            Measured: winding sensor stuck (FLT-S01) with the current sensor
            stuck (FLT-S09) is caught by SENSOR_DISAGREEMENT at step 28 with the
            winding at 187.5 C, past the limit. The DUT documents the frame limit
            alone tripping at step 50 with the winding at 643 C.
          gate: AND
          children:
            - &winding
              id: G-WINDING
              title: Winding sensor channel does not trip
              gate: OR
              children:
                - id: BE-TA-LOW
                  title: Winding sensor reads plausibly low
                  challenged_by: [FLT-S01, FLT-S03, FLT-S08]
                - &ccf_temp
                  id: BE-CCF-TEMP
                  title: One cause takes both thermal sensors
                  challenged_by: [FLT-S05]
                  note: >
                    A shared supply, reference or harness for the two thermal
                    sensors. Injected as FLT-S05, both sensors stuck at 40 C.
            - &overload
              id: G-OVERLOAD
              title: Overload (I2t) channel does not trip
              note: >
                The accumulator integrates the CURRENT SENSOR, not plant current,
                so the channel fails whenever that sensor under-reads.
              gate: OR
              children:
                - id: BE-CUR-LOW
                  title: Current sensor under-reads
                  challenged_by: [FLT-S09, FLT-S10]

        - id: G-D-OVERLOAD
          title: "Overload: every channel fails"
          note: >
            Every channel is credited, so this branch contributes no minimal cut
            set of its own: each of its combinations contains one from a branch
            beside it. It is drawn anyway, because leaving it out would look like
            an unexamined demand.
          gate: AND
          children:
            - *winding
            - &frame
              id: G-FRAME
              title: Cross check and frame limit silent
              note: >
                SENSOR_DISAGREEMENT and OVERTEMP_HOUSING share the frame sensor,
                and the housing limit is suppressed whenever the channels
                disagree, so they fail together. With the winding sensor already
                reading low, the cross check stays quiet only if the frame reads
                low as well.
              gate: OR
              children:
                - id: BE-TB-LOW
                  title: Frame sensor reads plausibly low
                  challenged_by: [FLT-S07]
                - *ccf_temp
            - *overload

        - id: G-D-COOLING
          title: "Cooling lost: winding and frame fail"
          note: >
            The overload channel is not credited here. Heat arrives at rated
            current, so the accumulator never grows: FLT-A03 ends with it at
            exactly zero and is caught by OVERTEMP_HOUSING at step 770. This is
            the branch that puts BE-CCF-TEMP at order 1. Measured: both
            temperature sensors stuck (FLT-S05) under degraded cooling runs to
            204 C undetected.
          gate: AND
          children:
            - *winding
            - *frame

    # --- common cause across every sensing path -----------------------------
    - id: BE-CCF-SUPPLY
      title: One cause takes every sensor at once
      challenged_by: []
      unattacked_reason: >
        A shared supply rail, reference or ADC under both temperature sensors
        AND the current sensor defeats every channel under every demand. This
        harness injects at the signal level and has no model of a shared
        resource, so it cannot inject this as ONE event. DP-05 shows its
        consequence as two separate faults (current sensor stuck plus both
        temperature sensors stuck), which ran to 1329 C undetected. Closing it is
        an architecture question, independent supplies and conversion paths,
        not a test question.

    # --- reaction: a trip is decided and torque is not removed --------------
    - id: BE-STO-INEFFECTIVE
      title: Trip decided, torque not removed
      challenged_by: []
      unattacked_reason: >
        In the DUT, STO is a software state that forces the speed to zero. There
        is no model of a power stage or an STO path that could keep conducting,
        so nothing here can inject this. FLT-T04 and FLT-T03 test the software
        latch (commands refused in STO, a reset re-trips), which is SR-07 and
        SR-08 and does not reach this event. The previous tree mapped it to two
        stall faults, which exercise the demand and not the output stage.
