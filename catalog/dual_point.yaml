# Latent fault plus primary fault.
#
# Each entry names a fault that is already present and unnoticed, and a second
# fault that arrives later. The single fault catalog cannot express this, and it
# is where a two channel design actually gets hurt: not when a sensor fails, but
# when a sensor fails while the channel that was supposed to catch it has been
# quietly dead.
#
# The control entries are as important as the failures. A latent fault that
# changed every outcome would not be latent.
version: 1

pairs:
  - id: DP-01
    title: Frame sensor already dead when the winding sensor starts lying
    latent: FLT-S07
    primary: FLT-S01
    kind: latent_plus_primary
    challenges: [SR-10, SR-11]
    expectation: handled
    rationale: >
      WAS VIOLATED until DUT v2.2, and this pair is why the third channel is
      diverse rather than simply additional.
      With two temperature sensors: FLT-S01 alone was caught at step 12 and
      bounded at 207 C, because the frame kept heating while the winding sensor
      insisted on ambient and that contradiction was visible. With the frame
      sensor already dead there was nothing left to contradict the lie, and the
      same fault ran to 1617 C entirely undetected. The second temperature
      source bounded the damage exactly as long as it was working, and nothing
      in the design noticed when it stopped. A safety mechanism nobody checks is
      a safety mechanism you do not have.
      The model based estimator does not depend on either sensor, so a dead
      frame channel takes nothing away from it. Caught at step 7, inside the
      limit, with or without the latent fault present. The pair is retained
      rather than deleted because the finding it produced is what motivated the
      fix, and because it now serves as the regression test for it.

  - id: DP-02
    title: Frame sensor already dead when a lying sensor meets a sustained overload
    latent: FLT-S07
    primary: FLT-S08
    kind: latent_plus_primary
    challenges: [SR-10, SR-11]
    expectation: handled
    rationale: >
      WAS VIOLATED until DUT v2.2, and it was the uncomfortable one, because
      FLT-S08 is the case the redundancy HANDLES. Alone it is caught at step 27 with the winding at 117 C, inside
      both its budget and its limit, and it is the entry that justifies calling
      the second temperature source worth having.
      With the frame channel already dead the same fault reached 383 C
      undetected. The protection that the design's best result depended on was
      exactly the protection a latent fault removed, which was a more pointed way
      of saying what DP-01 said: the value of a safety mechanism is conditional
      on somebody checking it is alive.
      The estimator does not depend on either sensor, so this is now handled.
      The lesson survives the fix: it was true of the two channel design and it
      would be true again of any mechanism added without a way to tell whether
      it still works.

  - id: DP-03
    title: Frame sensor already dead when the rotor stalls, sensors otherwise honest
    latent: FLT-S07
    primary: FLT-A01
    kind: latent_plus_primary
    challenges: [SR-04]
    expectation: handled
    rationale: >
      The control case, and the reason the other two mean anything. Here the
      winding sensor is honest, so the primary limit sees the stall and trips at
      step 7 with the winding at 139.6 C, inside its limit. The dead frame
      channel changes nothing whatever: it was never the mechanism doing the
      work.
      That is the definition of a latent fault rather than a bad one. It is
      consequential only in combination with a fault that needed the mechanism
      it removed, and an entry like this one is what stops the pair campaign
      from reading as "everything gets worse when you add a second fault".

  - id: DP-04
    title: Frame sensor already dead when the winding sensor drifts far low
    latent: FLT-S07
    primary: FLT-S03
    kind: latent_plus_primary
    challenges: [SR-10]
    expectation: handled
    rationale: >
      A second control case, and it survives for a reason worth stating. A 60 C
      negative bias drives the reported winding temperature below ambient, to
      about -20 C, so even a frame sensor frozen at ambient still reads far
      hotter than the winding claims to be. The contradiction is visible
      regardless.
      The mechanism still works, but only because this particular lie is
      absurd rather than plausible. It is a reminder that surviving one
      combination is not evidence of surviving the class, and that the margin
      here comes from the size of the error rather than from the design.

  - id: DP-05
    title: Current sensor stuck when both temperature sensors are also lying
    latent: FLT-S09
    primary: FLT-S05
    kind: dual_point
    challenges: [SR-10]
    expectation: violated
    rationale: >
      A DUAL POINT fault, not a latent one, and the distinction matters. Each
      member is detected perfectly well on its own: a stuck current sensor is
      caught at step 20 by the winding sensor, and both temperature sensors
      lying is caught at step 2 by the overload channel. Neither is silent.
      Together they are an undetected runaway past 1800 C, because each fault
      removes exactly the channel that catches the other.
      This pair was UNREACHABLE before DUT v3.1, and its absence is what made
      the diverse third channel look stronger than it is. While the overload
      channel read plant current directly it could not be faulted, so the
      campaign could only ever demonstrate the flattering direction. Giving it a
      sensor made the case expressible, and it immediately violated.
      What it does NOT overturn: the three temperature channel findings the
      diverse channel genuinely closed. What it does overturn is the wider claim
      that diversity closed common cause. It closed common cause BETWEEN THE TWO
      TEMPERATURE SENSORS. A common cause spanning the temperature sensors and
      the current sensor, a shared supply, reference or ADC, is exactly the
      failure this pair describes and the design does not survive it.
      Closing it needs a fourth channel that shares nothing with the other
      three, or a plausibility check between commanded torque and reported
      current that would notice a current sensor disagreeing with the command.
