# Fault catalog.
#
# Every entry traces to a safety requirement in docs/HAZARD_ANALYSIS.md. Nothing
# here is injected because it seemed interesting: a fault exists to challenge a
# requirement, and a requirement with no fault challenging it fails the build.
#
# Adding a fault is a change to THIS FILE ONLY. The tests are catalog driven, so
# fault 19 needs no new test code, which is the property a safety review looks
# for and the reason the catalog is data rather than Python.
#
# expectation:
#   detected  the protection must catch it inside ftti_steps
#   residual  the current design CANNOT catch it. Catalogued deliberately and
#             reported as an open gap with the design change that would close
#             it. A campaign reporting 100% detection would not be credible.

version: 1

faults:

  # --- communication --------------------------------------------------------
  - id: FLT-C01
    title: Speed command corrupted to an out of range value
    fault_class: communication
    description: >
      A bit error in transit turns a valid speed into one above the rated
      maximum. The controller must reject it rather than clamp it, because
      clamping silently substitutes a value nobody commanded.
    injection: {hook: corrupt_speed_argument, params: {to_rpm: 9999}}
    challenges: [SR-01]
    safe_state: none
    ftti_steps: 1
    expectation: detected

  - id: FLT-C02
    title: Malformed command frame
    fault_class: communication
    description: >
      The frame arrives with a non numeric argument. Must be rejected, and must
      not disturb the current setpoint.
    injection: {hook: corrupt_speed_argument, params: {to_literal: "NaN%%"}}
    challenges: [SR-02]
    safe_state: none
    ftti_steps: 1
    expectation: detected

  - id: FLT-C03
    title: Command channel falls silent
    fault_class: communication
    description: >
      The supervisory controller stops sending. Nothing is corrupted, nothing is
      rejected, and the drive would happily keep turning forever. Only the
      watchdog closes this.
    injection: {hook: silence_channel, params: {}}
    challenges: [SR-05]
    safe_state: STO
    ftti_steps: 11
    expectation: detected

  - id: FLT-C04
    title: Channel echoes stale OK responses
    fault_class: communication
    description: >
      The link answers OK to everything without the controller ever seeing the
      command. Every protocol level check passes, because the replies are
      well formed and successful. This is the fault that proves a protocol
      check is not a liveness check.
    injection: {hook: stale_ok_echo, params: {}}
    challenges: [SR-06]
    safe_state: STO
    ftti_steps: 11
    expectation: detected

  - id: FLT-C05
    title: Response truncated, terminator lost
    fault_class: communication
    description: >
      The reply arrives without its line terminator, so the driver cannot frame
      it. Must surface as a transport error rather than a silently wrong value.
    injection: {hook: truncate_response, params: {}}
    challenges: [SR-02]
    safe_state: none
    ftti_steps: 1
    expectation: detected

  - id: FLT-C06
    title: Command dropped, success fabricated
    fault_class: communication
    description: >
      The request never reaches the controller and the transport fabricates an
      OK. Indistinguishable from success at the protocol layer, so again only
      the watchdog catches it.
    injection: {hook: drop_command, params: {}}
    challenges: [SR-06]
    safe_state: STO
    ftti_steps: 11
    expectation: detected

  - id: FLT-C07
    title: Responses delayed beyond the supervisor's patience
    fault_class: communication
    description: >
      Replies are correct but late. MEASURED FINDING, and it moved this entry:
      the commands themselves still reach the controller, so the watchdog stays
      fed and the drive is genuinely healthy. Nothing enters STO, and nothing
      should. What breaks is the SUPERVISOR'S VIEW, and the driver detects it by
      failing to frame a reply in time. The lesson is about the item boundary: a
      fault on the return path is not a fault in the drive, and a catalog that
      demanded STO here would be asserting a hazard that does not exist.
    injection: {hook: delay_response, params: {steps: 15}}
    challenges: [SR-02]
    safe_state: none
    ftti_steps: 1
    expectation: detected

  - id: FLT-C08
    title: Response for a different command (masquerade)
    fault_class: communication
    description: >
      A reply intended for GET_TEMP is delivered in answer to GET_SPEED. Both
      are well formed OK responses, both are fresh, and nothing in the protocol
      binds a reply to its request.
    injection: {hook: masquerade_response, params: {}}
    challenges: [SR-06]
    safe_state: none
    ftti_steps: null
    expectation: residual
    residual_rationale: >
      The protocol carries no request identifier, so a well formed reply cannot
      be bound to the command that caused it. Closing this needs a data
      identifier in the protected frame, which is exactly what AUTOSAR E2E's
      Data ID and PROFIsafe's F_Destination_Address provide. Addressed in the
      protection layer, not by the bare protocol.

  # --- sensor ---------------------------------------------------------------
  - id: FLT-S01
    title: Temperature sensor stuck at a safe value
    fault_class: sensor
    description: >
      The reported winding temperature never leaves ambient while the winding
      actually heats. Any protection reading only the reported value is blind.
    injection: {hook: temperature_stuck, params: {at_c: 40.0}}
    precondition: stalled_rotor
    challenges: [SR-10]
    safe_state: STO
    ftti_steps: 22
    expectation: detected
    history: >
      This entry has driven two design changes and is the spine of the project's
      argument, so its history is kept rather than overwritten.
      AGAINST A SINGLE TEMPERATURE SOURCE it was residual. The drive never
      tripped at all and the winding ran past 1100 C, because the protection
      trips on the reported value and the reported value was a lie. DUT v1.5
      added a second temperature source in response.
      AGAINST TWO SOURCES it was LATE. The frame cross check fired at step 12,
      five steps past the 7 step budget, with the winding at 207 C, already past
      its limit. The cause was structural rather than a tuning error: the frame
      is a larger thermal mass, so it necessarily lags, and a cross check cannot
      react faster than its slower channel responds. Under locked rotor current
      the winding covers its entire permitted rise in 7 steps, which no
      thermometer mounted further from the heat can match. Detection is not
      protection.
      AGAINST THREE CHANNELS it is detected in time. DUT v2.2 added a model
      based estimator that integrates commanded loss instead of measuring
      temperature, so it has no thermal mass and no lag. Caught at step 7 with
      the winding at 139.6 C, inside both budget and limit. The fix was a
      different KIND of channel, not a better threshold, and that is the lesson
      worth carrying: the second thermometer was the obvious answer and the
      wrong one.

  - id: FLT-S02
    title: Temperature sensor stuck at an alarming value
    fault_class: sensor
    description: >
      The inverse of FLT-S01. The trip fires when nothing is wrong. Unwanted,
      but it fails towards the safe state, and the campaign records that
      direction rather than treating every trip as success.
    injection: {hook: temperature_stuck, params: {at_c: 200.0}}
    challenges: [SR-03]
    safe_state: STO
    ftti_steps: 22
    expectation: detected

  - id: FLT-S03
    title: Temperature sensor drifts low
    fault_class: sensor
    description: >
      A slow negative bias, the hardest sensor fault to notice, because every
      individual reading is plausible.
    injection: {hook: temperature_bias, params: {offset_c: -60.0}}
    precondition: stalled_rotor
    challenges: [SR-10]
    safe_state: STO
    ftti_steps: 22
    expectation: detected
    history: >
      WAS RESIDUAL until DUT v1.5. Same root cause as FLT-S01 and harder,
      because every individual reading is plausible and a bias large enough to
      matter was indistinguishable from a cooler motor. It is now caught at step
      1, and by only ONE of the three thermal checks: neither temperature limit
      is ever reached, so nothing but the DISAGREEMENT between the two channels
      exposes it. That is the argument for cross checking rather than for simply
      adding a second trip point, and it is why the second source is worth more
      than a redundant threshold.

  - id: FLT-S08
    title: Winding sensor stuck while the motor is overloaded but still turning
    fault_class: sensor
    description: >
      The same lie as FLT-S01 under a condition far more likely than a locked
      rotor: twice rated torque, still turning, heating at four times rated
      because loss goes as current squared. Slower, so the detection margins
      that the whole SR-10 argument turns on are different here.
    injection: {hook: temperature_stuck, params: {at_c: 40.0}}
    precondition: overloaded_rotor
    challenges: [SR-10]
    safe_state: STO
    ftti_steps: 136
    expectation: detected
    history: >
      Added after a review pointed out that every thermal sensor fault carried
      the stalled rotor precondition, so the only thermal hazard exercised was
      the fastest and most obvious one. The budget is derived the same way as
      the others, by measuring how long the winding takes to cover its permitted
      rise at this load: 36 steps here against 7 under locked rotor current.
      THE RESULT IS THE INTERESTING PART. The cross check fires at step 27,
      inside the budget, with the winding at 117 C and still under its limit. So
      the second temperature source DOES protect against a lying sensor under a
      sustained overload, and fails only under the locked rotor case where the
      winding covers its entire rise faster than the frame can follow. The
      earlier catalog, testing only the stall, made the redundancy look simply
      inadequate. It is adequate for the likelier hazard and inadequate for the
      fastest one, which is a much more useful thing to know and was invisible
      until the overload condition existed.

  - id: FLT-S05
    title: Both temperature sensors stuck at a safe value (common cause)
    fault_class: sensor
    description: >
      One root cause takes both thermal sensors at once. The case redundancy
      cannot answer, because two channels are two channels only for as long as
      they fail independently.
    injection: {hook: both_temperatures_stuck, params: {at_c: 40.0}}
    precondition: stalled_rotor
    challenges: [SR-10]
    safe_state: STO
    ftti_steps: 22
    expectation: detected
    history: >
      WAS RESIDUAL until DUT v2.2, and it is the clearest demonstration in this
      catalog of the difference between redundant and diverse. With two
      temperature sensors the winding ran past 1500 C undetected, exactly as the
      single channel design did: a shared supply, ADC reference, harness or
      connector makes two sensors one channel wearing two names, and both limits
      plus the cross check between them agreed perfectly all the way to
      destruction.
      The entry's own rationale said closing it needed channels that were
      DIVERSE rather than merely duplicated. The model based estimator is
      exactly that, because it does not read a sensor at all, so whatever took
      both sensors leaves it untouched. Caught at step 7, inside the limit.
      What has NOT changed is the argument. A third channel of the same kind
      would still have failed here. This closes because the third channel is a
      different kind, and FLT-A03 is catalogued alongside it to show the price:
      the estimator is blind to the plant in exactly the way the sensors are not.

  - id: FLT-S06
    title: Frame sensor reads high while the motor is healthy
    fault_class: sensor
    description: >
      The failure mode that adding a second channel introduced. 120 C is below
      the winding limit and looks entirely plausible, so nothing about the value
      announces a fault, and the motor it is describing is at 40 C.
    injection: {hook: housing_stuck, params: {at_c: 120.0}}
    challenges: [SR-11]
    safe_state: STO
    ftti_steps: 22
    expectation: detected
    history: >
      Uncatalogued until a review in July 2026. Redundancy is a second thing
      that can fail, and the only entry touching this sensor failed BOTH
      channels at once, so the whole failure space of the newly added component
      was untested. Against DUT v2.0 this tripped OVERTEMP_HOUSING at step 1: an
      overtemperature the motor was not having. v2.1 reports SENSOR_DISAGREEMENT
      instead, because two channels can detect a contradiction and cannot
      attribute it, and naming the wrong condition sends maintenance to the
      wrong part.

  - id: FLT-S07
    title: Frame sensor reads low, removing the backstop silently
    fault_class: sensor
    description: >
      The mirror of FLT-S06 and undetectable by construction. The frame is
      supposed to be the cooler node, so a low reading contradicts nothing.
    injection: {hook: housing_stuck, params: {at_c: 40.0}}
    challenges: [SR-11]
    safe_state: none
    ftti_steps: null
    expectation: residual
    residual_rationale: >
      A two channel design detects DISAGREEMENT, and a frame sensor reading low
      never disagrees with anything: it reads cooler than the winding, which is
      exactly what a healthy frame does. So the second channel goes quietly dead
      and the backstop it provides disappears with no indication whatever.
      This entry is deliberately run WITHOUT the stalled rotor precondition its
      siblings carry, and the reason is the interesting part. With a stall the
      winding sensor is honest and trips on its own, so the run would report
      "detected" while measuring nothing about the frame sensor at all. The
      first version of this entry did exactly that and the campaign caught it.
      What that exposes is the KIND of fault this is: a LATENT one. It has no
      effect by itself and removes a backstop that only matters once the primary
      channel has also failed. Demonstrating the consequence needs a dual point
      injection, latent plus primary, which this harness does not do and which is
      named as a scope limit in the safety argument. ISO 26262's latent fault
      metrics exist precisely for this combination, and this entry is the closest
      the catalog comes to one.
      Closing it needs a third channel, or a plausibility check of the frame
      reading against commanded current and elapsed time, which is the same
      estimator FLT-S01 needs and would serve both.

  - id: FLT-S04
    title: Speed feedback stuck at zero
    fault_class: sensor
    description: >
      The controller reports no motion while the rotor turns. Nothing in the
      item cross checks commanded speed against measured speed.
    injection: {hook: speed_feedback_stuck, params: {at_rpm: 0.0}}
    challenges: [SR-09]
    safe_state: none
    ftti_steps: null
    expectation: residual
    residual_rationale: >
      There is a single speed source, so there is nothing to disagree with it.
      Closing this needs a second independent measurement, or a plausibility
      check of speed against commanded torque and elapsed time. Out of scope for
      a single channel item, and named rather than hidden.

  # --- actuator -------------------------------------------------------------
  - id: FLT-A01
    title: Rotor stalled while torque is commanded
    fault_class: actuator
    description: >
      Mechanically blocked shaft. No motion, full current, so the winding heats
      far faster than in normal running. The thermal path must reach the safe
      state before the insulation limit.
    injection: {hook: stall_rotor, params: {}}
    challenges: [SR-04]
    safe_state: STO
    ftti_steps: 22
    expectation: detected

  - id: FLT-A02
    title: Torque lost, motor free spinning
    fault_class: actuator
    description: >
      The command is accepted and the controller believes it is driving, but no
      torque reaches the shaft, for example a severed phase.
    injection: {hook: torque_loss, params: {}}
    challenges: [SR-09]
    safe_state: none
    ftti_steps: null
    expectation: residual
    residual_rationale: >
      Loss of torque is silent without current sensing or a load side
      measurement, neither of which this item has. Closing it needs current
      feedback compared against the commanded operating point.

  # --- timing ---------------------------------------------------------------
  - id: FLT-A03
    title: Cooling degraded, plant running hotter than commanded
    fault_class: actuator
    description: >
      A blocked fan or a clogged filter. The drive commands exactly what it
      always did and the machine runs hotter, so nothing about the COMMAND is
      wrong and only a measurement can notice.
    injection: {hook: degrade_cooling, params: {scale: 0.35}}
    challenges: [SR-03]
    safe_state: STO
    ftti_steps: 1041
    expectation: detected
    history: >
      Added with the model based estimator in DUT v2.2, deliberately, to
      demonstrate the OTHER half of the diversity argument. The estimator closes
      every sensor fault in this catalog because it does not read a sensor. This
      entry is what it cannot do: it knows only what was commanded and assumes
      nominal cooling, so with real cooling at a third of nominal it predicts the
      nominal and misses the fault entirely. The winding sensor catches it.
      So neither kind of channel is sufficient and the pair is not redundancy, it
      is coverage of two disjoint failure classes. An argument for diversity that
      only demonstrates the flattering half is not an argument, which is why this
      entry exists even though it passes.
      The budget is derived like the others, being the steps the winding takes to
      reach its limit under this condition.

  - id: FLT-T01
    title: Watchdog starved
    fault_class: timing
    description: >
      The supervisor stops kicking while the drive continues to run. The base
      case for the watchdog, and the reference against which the subtler
      liveness faults are judged.
    injection: {hook: starve_watchdog, params: {}}
    challenges: [SR-05]
    safe_state: STO
    ftti_steps: 11
    expectation: detected

  - id: FLT-T02
    title: Watchdog kick arrives one step late
    fault_class: timing
    description: >
      The boundary case. A kick exactly one step after the budget expires must
      not rescue the drive, because by then the fault has already latched.
    injection: {hook: late_watchdog_kick, params: {late_by: 1}}
    challenges: [SR-05, SR-08]
    safe_state: STO
    ftti_steps: 11
    expectation: detected

  - id: FLT-T03
    title: Reset attempted while the fault condition persists
    fault_class: timing
    description: >
      An operator resets without clearing the cause. The drive may return to
      service, but must trip again rather than run on with the condition still
      present.
    injection: {hook: reset_without_clearing, params: {}}
    precondition: stalled_rotor
    challenges: [SR-08]
    safe_state: STO
    ftti_steps: 20
    expectation: detected

  - id: FLT-T04
    title: Commands issued continuously while in the safe state
    fault_class: timing
    description: >
      A supervisor that has not noticed the fault keeps commanding speed. The
      safe state must hold under sustained pressure, not merely once.
    injection: {hook: hammer_commands_in_fault, params: {count: 50}}
    precondition: stalled_rotor
    challenges: [SR-07, SR-08]
    safe_state: STO
    ftti_steps: 20
    expectation: detected

  - id: FLT-T05
    title: Telemetry read while in the safe state
    fault_class: timing
    description: >
      Not a hazard, a diagnosability requirement. A drive that goes silent when
      it trips cannot be investigated, and an operator cannot tell an
      overtemperature trip from a lost link.
    injection: {hook: read_telemetry_in_fault, params: {}}
    challenges: [SR-09]
    safe_state: STO
    ftti_steps: 1
    expectation: detected
