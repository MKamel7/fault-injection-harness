name: verify

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: lint + types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Lint (ruff)
        run: uv run --group dev ruff check .
      - name: Type check (mypy strict)
        run: uv run --group dev mypy

  campaign:
    name: fault campaign
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run the catalog driven suite
        run: >
          uv run --group dev pytest
          --cov-report=xml
          --html=report-py${{ matrix.python-version }}.html --self-contained-html
          --junitxml=junit-py${{ matrix.python-version }}.xml

      # The evidence is regenerated on every push rather than committed and
      # trusted. A traceability matrix that is only as current as the last time
      # someone remembered to rebuild it is not evidence of anything. This step
      # exits non-zero on a traceability gap or a missed FTTI budget, so the
      # build fails when the artifacts stop supporting the claims.
      - name: Rebuild the traceability matrix and coverage report
        run: uv run --group dev python scripts/build_report.py

      # The generated artifacts are also committed, so a reader of the repo can
      # see them without running anything. This catches the case where someone
      # edits the catalog and the checked in report goes stale: the diff is the
      # failure message.
      - name: Fail if the committed artifacts are stale
        run: |
          if ! git diff --quiet -- report/; then
            echo "::error::report/ is out of date. Run scripts/build_report.py and commit the result."
            git --no-pager diff -- report/
            exit 1
          fi

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidence-py${{ matrix.python-version }}
          path: |
            report/traceability.md
            report/coverage.md
            report-py${{ matrix.python-version }}.html
            junit-py${{ matrix.python-version }}.xml
